<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
</head>
<body>
    <h2>Student Registrtion</h2>
    <table>
        <tr>
            <td> Name</td>
            <td><input type="text" placeholder="User Name"></td>
        </tr>

        <tr>
            <td>Password</td>
            <td><input type="password" placeholder="password"></td>
        </tr>
        <tr>
            <td>Gender</td>
            <td><input type="radio" name="gender" value="male">Male
            <input type="radio" name="gender" value="female">Female    
            </td>
            
        </tr>
       
    <tr>
        <td>
            Upload a photo
        </td>
        <td>
            <input type="file">
        </td>
    </tr>
     <tr>
           <td>
            <button>
                Register      
            </button>
           </td> 
        </tr>


    </table>
    <span> Don't have an account? Go to <a href="https://portal.aiub.edu/">Sign In</a></span>
</body>
</html>
