
<html>
<head>
   
    
    <title>Student Registration</title>
    <link rel="stylesheet" href="formdesign.css">
    <script src="formValidation.js"></script>
</head>
<body>

    <h1 id="pageTitle">Student Registration</h1>

    <div id="container">
        <form onsubmit="return submitForm()">
            <fieldset>
                <legend><b>Registration Form</b></legend>
                <table>
                    <tr>
                        <td><label><b>First Name <span class="red">*</span></b></label></td>
                        <td><input type="text" id="firstName" /></td>
                        <td><p id="firstNameError"></p></td>
                    </tr>
                    <tr>
                        <td><label><b>Last Name <span class="red">*</span></b></label></td>
                        <td><input type="text" id="lastName" /></td>
                        <td><p id="lastNameError"></p></td>
                    </tr>
                    <tr>
                        <td><label><b>Student ID <span class="red">*</span></b></label></td>
                        <td><input type="text" id="studentId" /></td>
                        <td><p id="studentIdError"></p></td>
                    </tr>
                    <tr>
                        <td><label><b>Email <span class="red">*</span></b></label></td>
                        <td><input type="text" id="email" /></td>
                        <td><p id="emailError"></p></td>
                    </tr>
                    <tr>
                        <td><label><b>Credit Completed <span class="red">*</span></b></label></td>
                        <td><input type="number" id="credit" /></td>
                        <td><p id="creditError"></p></td>
                    </tr>
                    <tr>
                        <td><label><b>Department <span class="red">*</span></b></label></td>
                        <td>
                            <select id="department">
                                <option value="">-- Select Department --</option>
                                <option value="CSE">CSE</option>
                                <option value="EEE">EEE</option>
                                <option value="BBA">BBA</option>
                                <option value="LLB">LLB</option>
                            </select>
                        </td>
                        <td><p id="departmentError"></p></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td id="btnCell"><button type="submit">Register</button></td>
                    </tr>
                </table>
            </fieldset>
        </form>
    </div>

    <br>

    <div id="studentListContainer">
        <h2>Registered Students</h2>
        <table id="studentTable" border="1">
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Student ID</th>
                    <th>Email</th>
                    <th>Credit Completed</th>
                    <th>Department</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
            </tbody>
        </table>
    </div>

</body>
</html>
